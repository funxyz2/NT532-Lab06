services:
  iot-platform:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/attendance.db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-recognition_result}
    volumes:
      - attendance-data:/app/data
    restart: unless-stopped

volumes:
  attendance-data:
