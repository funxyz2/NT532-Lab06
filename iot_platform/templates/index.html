<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoT Attendance Platform</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f6f8; color: #17202a; }
    header { background: #123047; color: white; padding: 24px 6vw; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 10px #00000012; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button { padding: 9px 10px; border: 1px solid #ccd5db; border-radius: 6px; }
    button { background: #1677a8; color: white; border: 0; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 14px; }
    th, td { border-bottom: 1px solid #e5e9ec; text-align: left; padding: 10px 8px; }
    th { background: #eef4f7; }
    .muted { color: #65727d; }
  </style>
</head>
<body>
  <header><h1>IoT Attendance Platform</h1><div>Quản lý điểm danh từ Edge Server</div></header>
  <main>
    <section class="card">
      <h2>Danh sách điểm danh</h2>
      <div class="toolbar">
        <input id="student" placeholder="Tên sinh viên">
        <input id="room" placeholder="Room ID">
        <button onclick="loadAttendance()">Tải dữ liệu</button>
      </div>
      <p id="status" class="muted">Đang tải...</p>
      <table><thead><tr><th>Thời gian</th><th>Sinh viên</th><th>Phòng</th><th>Thiết bị</th><th>Loại</th></tr></thead>
        <tbody id="attendance"></tbody>
      </table>
    </section>
    <section class="card"><h2>Thống kê</h2><table><thead><tr><th>Sinh viên</th><th>Phòng</th><th>Loại</th><th>Số lần</th></tr></thead><tbody id="summary"></tbody></table></section>
  </main>
  <script>
    function formatTimestamp(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    }
    async function loadAttendance() {
      const params = new URLSearchParams({limit: 100});
      if (student.value) params.set('student_name', student.value);
      if (room.value) params.set('room_id', room.value);
      const response = await fetch('/api/attendance?' + params);
      const data = await response.json();
      attendance.innerHTML = data.items.map(row => `<tr><td>${formatTimestamp(row.timestamp)}</td><td>${row.student_name}</td><td>${row.room_id}</td><td>${row.device_id}</td><td>${row.check_type}</td></tr>`).join('');
      status.textContent = `${data.count} bản ghi`;
      const summaryResponse = await fetch('/api/attendance/summary');
      const summaryData = await summaryResponse.json();
      summary.innerHTML = summaryData.items.map(row => `<tr><td>${row.student_name}</td><td>${row.room_id}</td><td>${row.check_type}</td><td>${row.total}</td></tr>`).join('');
    }
    loadAttendance();
  </script>
</body>
</html>
